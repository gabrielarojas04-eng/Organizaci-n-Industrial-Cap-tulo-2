<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dunkin - Naturaleza y Tamaño</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial;background:#fff7fb;margin:0}
header{background:linear-gradient(135deg,#4b156d,#e11383,#f58220);color:white;padding:60px;text-align:center}
section{max-width:1000px;margin:30px auto;padding:30px;background:white;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
h2{color:#4b156d}
input{width:100%}
.interactive{background:#fff2f8;padding:20px;border-radius:10px;border:2px dashed #e11383}
.result{font-weight:bold;margin-top:15px;color:#4b156d}
</style>
</head>
<body>

<header>
<h1>Dunkin’ Donuts</h1>
<p>Visualización del punto óptimo de integración</p>
</header>

<section>
<h2>Visualización Interactiva del Punto Óptimo</h2>
<p>Mueve el control para ver cómo cambian los costos de mercado y de empresa.</p>

<div class="interactive">
<label>Nivel de integración:</label>
<input type="range" min="0" max="100" value="50" id="slider" oninput="updateChart()">

<canvas id="grafico"></canvas>

<p class="result" id="texto"></p>
</div>
</section>

<script>
const ctx = document.getElementById('grafico');

let chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: Array.from({length: 101}, (_, i) => i),
        datasets: [
            {
                label: 'Costos de Mercado',
                data: [],
                tension: 0.4
            },
            {
                label: 'Costos de Empresa',
                data: [],
                tension: 0.4
            }
        ]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {display: true}
        },
        scales: {
            x: {title:{display:true,text:'Nivel de integración'}},
            y: {title:{display:true,text:'Costo relativo'}}
        }
    }
});

function generarDatos(){
    let mercado=[];
    let empresa=[];

    for(let i=0;i<=100;i++){
        mercado.push(100 - i + Math.random()*5);
        empresa.push(i + Math.random()*5);
    }

    return {mercado, empresa};
}

function updateChart(){
    const val = document.getElementById('slider').value;
    const texto = document.getElementById('texto');

    let datos = generarDatos();

    chart.data.datasets[0].data = datos.mercado;
    chart.data.datasets[1].data = datos.empresa;

    chart.update();

    if(val < 35){
        texto.innerText = 'Dependencia alta del mercado → menor control';
    } else if(val <= 70){
        texto.innerText = 'Punto óptimo → modelo Dunkin (franquicia)';
    } else {
        texto.innerText = 'Alta integración → mayor control pero más costos internos';
    }
}

updateChart();
</script>

</body>
</html>
